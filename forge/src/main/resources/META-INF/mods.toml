modLoader = "javafml"
loaderVersion = "*"
license = "CC0-1.0"
issueTrackerURL = "https://github.com/Sxilverrr/Uncapped-Spectator-Speed/issues"

[[mods]]
modId = "${id}"
version = "${version}"
displayName = "${name}"
authors = "Sxilverr"
description = "Removes the spectator flight speed cap when scrolling."
logoFile = "icon.png"
displayURL = "https://www.curseforge.com/minecraft/mc-mods/uncapped-spectator-speed"

[[dependencies.${id}]]
    modId = "forge"
    mandatory = true
    versionRange = "${forge_range}"
    ordering = "NONE"
    side = "BOTH"

[[dependencies.${id}]]
    modId = "minecraft"
    mandatory = true
    versionRange = "${minecraft}"
    ordering = "NONE"
    side = "BOTH"
